
services:
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: always
    env_file:
      - .env
    networks:
      - app_net
    ports:
      - "8000:8000"
  
  frontend:
    build:
      context: ./frontend
    ports:
      - "5000:80"
    depends_on:
      - backend
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - app_net


networks:
  app_net:
    driver: bridge
